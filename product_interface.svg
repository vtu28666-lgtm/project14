<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#09090b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;">
  <defs>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="1280" height="720" rx="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#screenClip)">
    <!-- Window Frame / Top Titlebar -->
    <rect x="0" y="0" width="1280" height="38" fill="#121214" stroke="#27272a" stroke-width="1"/>
    <circle cx="20" cy="19" r="5" fill="#27272a"/>
    <circle cx="36" cy="19" r="5" fill="#27272a"/>
    <circle cx="52" cy="19" r="5" fill="#27272a"/>
    <text x="640" y="24" text-anchor="middle" fill="#71717a" font-size="12" font-weight="500">ApproxMAC Live Edge Oscilloscope — 127.0.0.1:8000/monitor.html</text>

    <!-- Sidebar Layout -->
    <rect x="0" y="38" width="230" height="682" fill="#0c0c0e" stroke="#27272a" stroke-width="1"/>
    
    <!-- Wordmark -->
    <text x="24" y="74" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="-0.3">ApproxMAC<tspan fill="#71717a">.v2</tspan></text>

    <!-- Sidebar Navigation -->
    <g transform="translate(16, 96)">
      <!-- Active Link -->
      <rect x="0" y="0" width="198" height="32" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="20" fill="#ffffff" font-size="12.5" font-weight="600">● Live Monitor</text>

      <text x="12" y="56" fill="#71717a" font-size="12.5">Spectral &amp; FFT</text>
      <text x="12" y="88" fill="#71717a" font-size="12.5">Bit Inspector</text>
      <text x="12" y="120" fill="#71717a" font-size="12.5">AI Policy Explainer</text>
      <text x="12" y="152" fill="#71717a" font-size="12.5">Energy &amp; Silicon</text>
      <text x="12" y="184" fill="#71717a" font-size="12.5">Fault Analytics</text>
      <text x="12" y="216" fill="#71717a" font-size="12.5">Replay &amp; Hardware</text>
    </g>

    <!-- Connection Box -->
    <g transform="translate(16, 650)">
      <rect x="0" y="0" width="198" height="36" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="28" y="22" fill="#a1a1aa" font-size="11.5">WebSocket 120 FPS</text>
    </g>

    <!-- Main Workspace -->
    <g transform="translate(254, 54)">
      <!-- Header Bar -->
      <text x="0" y="22" fill="#ffffff" font-size="18" font-weight="700">Live Edge Oscilloscope &amp; Precision Monitor</text>
      <text x="0" y="40" fill="#71717a" font-size="12">Real-time vibration ingestion with dynamic 16-bit to 6-bit MAC truncation</text>

      <!-- Speed & Pause Control Pill -->
      <rect x="740" y="8" width="260" height="30" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
      <text x="752" y="28" fill="#a1a1aa" font-size="11.5">Delay: 1.0s (Calm 1x)</text>
      <rect x="880" y="12" width="112" height="22" rx="3" fill="#1f1f23" stroke="#333333" stroke-width="1"/>
      <text x="936" y="27" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Stream Active</text>

      <!-- 4 Top KPI Cards -->
      <g transform="translate(0, 56)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="235" height="76" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="14" y="22" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.5">DYNAMIC PRECISION</text>
        <text x="14" y="46" fill="#10b981" font-size="18" font-weight="700">Aggressive Approx</text>
        <text x="14" y="64" fill="#71717a" font-size="10.5">6-Bit Active (0.22x Energy)</text>

        <!-- Card 2 -->
        <rect x="255" y="0" width="235" height="76" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="269" y="22" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.5">MEASURED ENERGY SAVINGS</text>
        <text x="269" y="46" fill="#ffffff" font-size="18" font-weight="700">78.0%</text>
        <text x="269" y="64" fill="#71717a" font-size="10.5">vs. Fixed 16-Bit Integer</text>

        <!-- Card 3 -->
        <rect x="510" y="0" width="235" height="76" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="524" y="22" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.5">VIBRATION KURTOSIS</text>
        <text x="524" y="46" fill="#ffffff" font-size="18" font-weight="700">1.84</text>
        <text x="524" y="64" fill="#71717a" font-size="10.5">Fault Threshold: &gt; 3.50</text>

        <!-- Card 4 -->
        <rect x="765" y="0" width="235" height="76" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="779" y="22" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.5">MACHINE INFERENCE STATE</text>
        <text x="779" y="46" fill="#10b981" font-size="18" font-weight="700">STEADY NORMAL</text>
        <text x="779" y="64" fill="#71717a" font-size="10.5">Processed MACs: 248,603</text>
      </g>

      <!-- Primary Oscilloscope Card with Smooth ECG Spike Indication -->
      <g transform="translate(0, 146)">
        <rect x="0" y="0" width="1000" height="270" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="16" y="24" fill="#71717a" font-size="11" font-weight="600" letter-spacing="0.5">LIVE TIME-DOMAIN VIBRATION TRACE (50-PT CATMULL-ROM SPLINE)</text>
        
        <!-- ECG Status Pill in SVG -->
        <g transform="translate(680, 10)">
          <rect x="0" y="0" width="304" height="24" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1"/>
          <circle cx="14" cy="12" r="4" fill="#ef4444"/>
          <text x="24" y="16" fill="#ef4444" font-size="10" font-weight="700">⚡ ECG IMPULSE SPIKE: OUTLIER +2.48V</text>
        </g>

        <!-- Grid lines & Threshold Envelopes -->
        <line x1="16" y1="52" x2="984" y2="52" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6"/>
        <text x="920" y="48" fill="#f59e0b" font-size="9">+1.80 V (Upper Lim)</text>

        <line x1="16" y1="110" x2="984" y2="110" stroke="#1f1f23" stroke-width="1"/>
        <line x1="16" y1="160" x2="984" y2="160" stroke="#27272a" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="945" y="156" fill="#71717a" font-size="9.5">0.00 V</text>

        <line x1="16" y1="210" x2="984" y2="210" stroke="#1f1f23" stroke-width="1"/>
        <line x1="16" y1="238" x2="984" y2="238" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6"/>
        <text x="920" y="248" fill="#f59e0b" font-size="9">-1.80 V (Lower Lim)</text>

        <!-- Smooth Spline Waveform Path with Anomaly Peak Spike -->
        <path d="M 20 160 C 50 160, 70 145, 90 145 C 110 145, 130 175, 150 175 C 180 175, 200 150, 220 150 C 240 150, 260 165, 280 165 C 310 165, 330 140, 350 140 C 370 140, 390 180, 410 180 C 440 180, 460 155, 480 155 C 510 155, 525 170, 540 170 C 545 170, 550 190, 555 190 C 560 190, 570 34, 578 34 C 585 34, 595 240, 602 240 C 610 240, 620 160, 630 160 C 660 160, 680 140, 700 140 C 730 140, 750 175, 780 175 C 810 175, 830 150, 860 150 C 890 150, 920 165, 950 165 L 980 160" fill="none" stroke="#38bdf8" stroke-width="2.2"/>

        <!-- Spike Apex Node Highlighting -->
        <circle cx="578" cy="34" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2.2"/>
        <circle cx="602" cy="240" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
        <text x="590" y="32" fill="#ef4444" font-size="11" font-weight="700">+2.48 V (R-Peak Spike)</text>

        <!-- Legend / Metric markers -->
        <circle cx="28" cy="254" r="4" fill="#38bdf8"/>
        <text x="38" y="257" fill="#a1a1aa" font-size="10.5">Live Waveform (Catmull-Rom)</text>
        
        <circle cx="240" cy="254" r="4" fill="#ef4444"/>
        <text x="250" y="257" fill="#a1a1aa" font-size="10.5">Impulse Peak Indicator (&gt;1.5V)</text>

        <line x1="460" y1="254" x2="480" y2="254" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="490" y="257" fill="#a1a1aa" font-size="10.5">Threshold Envelope (&#177;1.80V)</text>
      </g>

      <!-- Bottom Split Cards: MAC Exact vs Approx and Fault Spike Buffer -->
      <g transform="translate(0, 430)">
        <!-- Left Sub-card -->
        <rect x="0" y="0" width="490" height="200" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="16" y="24" fill="#71717a" font-size="11" font-weight="600" letter-spacing="0.5">ARITHMETIC ACCURACY COMPARISON</text>
        
        <g transform="translate(16, 44)">
          <text x="0" y="16" fill="#71717a" font-size="11">Exact FP32 Baseline:</text>
          <text x="180" y="16" fill="#ffffff" font-size="12" font-family="monospace">142.9482</text>
          
          <text x="0" y="44" fill="#71717a" font-size="11">Approximate MAC (6-bit):</text>
          <text x="180" y="44" fill="#10b981" font-size="12" font-family="monospace">142.9450</text>

          <text x="0" y="72" fill="#71717a" font-size="11">Quantization Delta:</text>
          <text x="180" y="72" fill="#ffffff" font-size="12" font-family="monospace">0.0032 (0.002%)</text>

          <text x="0" y="100" fill="#71717a" font-size="11">Hardware Power Draw:</text>
          <text x="180" y="100" fill="#10b981" font-size="12" font-family="monospace">0.28 pJ/op (-78%)</text>
        </g>

        <!-- Right Sub-card -->
        <rect x="510" y="0" width="490" height="200" rx="4" fill="#121214" stroke="#27272a" stroke-width="1"/>
        <text x="526" y="24" fill="#71717a" font-size="11" font-weight="600" letter-spacing="0.5">XGBOOST DYNAMIC POLICY MATRIX</text>
        
        <g transform="translate(526, 44)">
          <text x="0" y="16" fill="#71717a" font-size="11">K-Threshold [Normal &lt; 3.5]:</text>
          <text x="210" y="16" fill="#10b981" font-size="12" font-family="monospace">PASS (Mode: AGGRESSIVE)</text>

          <text x="0" y="44" fill="#71717a" font-size="11">Variance [Normal &lt; 0.45]:</text>
          <text x="210" y="44" fill="#10b981" font-size="12" font-family="monospace">PASS (0.038)</text>

          <text x="0" y="72" fill="#71717a" font-size="11">Inference Latency:</text>
          <text x="210" y="72" fill="#ffffff" font-size="12" font-family="monospace">0.42 ms / window</text>

          <text x="0" y="100" fill="#71717a" font-size="11">Fail-Safe Override Trigger:</text>
          <text x="210" y="100" fill="#ffffff" font-size="12" font-family="monospace">Exact 16-bit (0 cycle lag)</text>
        </g>
      </g>
    </g>
  </g>
</svg>

